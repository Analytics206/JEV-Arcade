[project]
name = "wikirace"
version = "0.1.0"
description = "JEV-Arcade: WikiRace and fourteen more games that pit TypeSafe Jev against Claude, GPT, OpenRouter and local Ollama models, live."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "J. Harrell" }]
keywords = ["llm", "benchmark", "wikipedia", "wikirace", "typesafe", "ollama", "anthropic", "openai", "openrouter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Environment :: Web Environment",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Topic :: Games/Entertainment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "anthropic>=1.7,<2",
]

[project.scripts]
wikirace = "wikirace.__main__:main"

[project.urls]
Homepage = "https://jev-arcade.com"
Repository = "https://github.com/Analytics206/JEV-Arcade"
Issues = "https://github.com/Analytics206/JEV-Arcade/issues"
Changelog = "https://github.com/Analytics206/JEV-Arcade/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wikirace"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--tb=short"]
filterwarnings = [
    # Starlette's TestClient, not our code: an anyio alias it still imports.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["src/wikirace/static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
